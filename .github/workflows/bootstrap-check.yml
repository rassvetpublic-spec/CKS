name: CKS Bootstrap Check

on:
  push:
  pull_request:

jobs:
  validate-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify validator exit semantics
        run: python -m unittest discover -s tests -p 'test_cks_workflow_exit_semantics_stage_e3_2_a.py' -v
      - name: Validate Bootstrap
        run: python scripts/validate_bootstrap.py
