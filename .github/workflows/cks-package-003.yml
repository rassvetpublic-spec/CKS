name: CKS Package 003

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-003:
    name: Package 003 full gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate Knowledge Index
        run: python tools/cks_index_generator.py --output artifacts/package003/knowledge-index.json

      - name: Run Migration Audit
        run: python tools/cks_migration_audit.py --output artifacts/package003/migration-audit.json

      - name: Run Traceability Gate
        run: python tools/cks_ci.py --mode traceability

      - name: Run Canon Gate
        run: python tools/cks_ci.py --mode canon

      - name: Run shared Review and Boundary Gate
        uses: ./.github/actions/cks-review-gate

      - name: Run Governance Runner v2
        run: python tools/cks_governance_runner.py --report artifacts/package003/governance-runner.json

      - name: Run integration runner
        run: python scripts/run_integration_tests.py

      - name: Run complete unittest suite with zero-test guard
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          count = suite.countTestCases()
          print(f"discovered_tests={count}")
          if count == 0:
              print("ERROR: unittest discovery found zero tests", file=sys.stderr)
              raise SystemExit(2)

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Publish Knowledge Index artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: cks-package003-knowledge-index
          path: artifacts/package003/knowledge-index.json
          if-no-files-found: error

      - name: Publish Migration Audit artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: cks-package003-migration-audit
          path: artifacts/package003/migration-audit.json
          if-no-files-found: error

      - name: Publish Package 003 diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: cks-package003-diagnostics
          path: |
            artifacts/package003/governance-runner.json
            artifacts/cks-ci/**
          if-no-files-found: warn
