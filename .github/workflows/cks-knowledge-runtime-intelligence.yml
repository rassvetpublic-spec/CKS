      - 'tools/cks_v1_7_orphan_node_detector.py'
      - 'tools/cks_v1_7_relation_engine.py'
      - 'validators/lifecycle_guard.py'
      - 'schemas/cks-knowledge-object.schema.json'
      - 'schemas/cks-knowledge-view.schema.json'
      - 'schemas/cks_v1_7_graph_storage_model.yaml'
      - 'obsidian/**'
      - 'docs/CKS_KNOWLEDGE_RUNTIME_AND_INTELLIGENCE_RU.md'
      - 'docs/ГЛОССАРИЙ.md'
      - 'decisions/ADR-0002-knowledge-centric-runtime.md'
      - 'tests/test_knowledge_runtime_intelligence.py'
      - 'tests/test_cks_knowledge_runtime_stage2.py'
      - 'tests/test_cks_obsidian_stage3.py'
      - 'tests/test_cks_dynamic_views_stage4.py'
      - 'tests/test_cks_knowledge_intelligence_stage5.py'
      - 'tests/test_cks_knowledge_evolution_stage6.py'
      - 'tests/test_cks_full_self_audit_stage7.py'
      - 'tests/test_cks_graph_evolution_stage_b.py'
      - 'tests/test_cks_graph_node_lifecycle_stage_d.py'
      - 'tests/test_cks_post_snapshot_integrity_stage_e2.py'
      - '.github/workflows/cks-knowledge-runtime-intelligence.yml'

permissions:
  contents: read

jobs:
  knowledge-runtime:
    name: Проверка этапов 2–7, B/D и пост-снимочного E2
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверить синтаксис рабочих модулей
        run: |
          python -m py_compile tools/cks_knowledge_runtime.py
          python -m py_compile tools/cks_knowledge_state_machine.py
          python -m py_compile tools/cks_obsidian_export.py
          python -m py_compile tools/cks_dynamic_views.py
          python -m py_compile tools/cks_knowledge_intelligence.py
          python -m py_compile tools/cks_knowledge_evolution.py
          python -m py_compile tools/cks_version_change_analyzer.py
          python -m py_compile tools/cks_knowledge_graph_runtime.py
          python -m py_compile tools/cks_graph_node_versioning.py
          python -m py_compile tools/cks_traceability_engine.py
          python -m py_compile tools/cks_knowledge_federation.py
          python -m py_compile tools/cks_governance_runner.py
          python -m py_compile tools/cks_runtime_pipeline.py
          python -m py_compile tools/cks_self_audit.py
          python -m py_compile tools/cks_compatibility_audit.py
          python -m py_compile tools/cks_v1_7_graph_validator.py
          python -m py_compile tools/cks_v1_7_orphan_node_detector.py
          python -m py_compile tools/cks_v1_7_relation_engine.py
          python -m py_compile validators/lifecycle_guard.py

      - name: Этап 2 — рабочий контур и состояния
        run: python -m unittest discover -s tests -p 'test_cks_knowledge_runtime_stage2.py' -v

      - name: Этап 3 — Obsidian и графическое представление
        run: python -m unittest discover -s tests -p 'test_cks_obsidian_stage3.py' -v

      - name: Этап 4 — динамические представления
        run: python -m unittest discover -s tests -p 'test_cks_dynamic_views_stage4.py' -v

      - name: Базовая регрессия runtime и intelligence
        run: python -m unittest discover -s tests -p 'test_knowledge_runtime_intelligence.py' -v

      - name: Этап 5 — структурная аналитика знаний
        run: python -m unittest discover -s tests -p 'test_cks_knowledge_intelligence_stage5.py' -v

      - name: Этап 6 — эволюция, миграция и восстановление знаний
        run: python -m unittest discover -s tests -p 'test_cks_knowledge_evolution_stage6.py' -v

      - name: Этап 7 — полный самоаудит и интегральная регрессия
        run: python -m unittest discover -s tests -p 'test_cks_full_self_audit_stage7.py' -v

      - name: Этап B — история связей, миграция и восстановление графа
        run: python -m unittest discover -s tests -p 'test_cks_graph_evolution_stage_b.py' -v

      - name: Этап D — жизненный цикл и версии узлов графа
        run: python -m unittest discover -s tests -p 'test_cks_graph_node_lifecycle_stage_d.py' -v

      - name: Этап E2 — целостность compatibility-слоёв
        run: |
          python -m unittest discover -s tests -p 'test_cks_post_snapshot_integrity_stage_e2.py' -v
          python tools/cks_compatibility_audit.py

      - name: Выполнить самопроверку CKS
        run: python tools/cks_self_audit.py --root . --report reports/knowledge-runtime-self-audit.json

      - name: Выполнить интегральную проверку управления CKS
        run: python tools/cks_governance_runner.py --root . --report reports/knowledge-runtime-governance.json

      - name: Опубликовать диагностические отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cks-knowledge-runtime-stage7-reports
          path: |
            reports/knowledge-runtime-self-audit.json
            reports/knowledge-runtime-governance.json
          if-no-files-found: warn
