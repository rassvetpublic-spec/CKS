      - 'tools/cks_traceability_engine.py'
      - 'tools/cks_knowledge_federation.py'
      - 'tools/cks_governance_runner.py'
      - 'tools/cks_runtime_pipeline.py'
      - 'tools/cks_self_audit.py'
      - 'tools/cks_compatibility_audit.py'
      - 'tools/cks_v1_4_*.py'
      - 'tools/cks_v1_6_intelligence_runtime.py'
      - 'tools/cks_canon_conflict_detector.py'
      - 'tools/cks_knowledge_health_score.py'
      - 'tools/cks_v1_7_graph_validator.py'
      - 'tools/cks_v1_7_orphan_node_detector.py'
      - 'tools/cks_v1_7_relation_engine.py'
      - 'validators/lifecycle_guard.py'
      - 'schemas/cks-knowledge-object.schema.json'
      - 'schemas/cks-knowledge-view.schema.json'
      - 'schemas/cks_v1_7_graph_storage_model.yaml'
      - 'obsidian/**'
      - 'docs/CKS_KNOWLEDGE_RUNTIME_AND_INTELLIGENCE_RU.md'
      - 'docs/ГЛОССАРИЙ.md'
      - 'decisions/ADR-0002-knowledge-centric-runtime.md'
      - 'tests/test_knowledge_runtime_intelligence.py'
      - 'tests/test_cks_knowledge_runtime_stage2.py'
      - 'tests/test_cks_obsidian_stage3.py'
      - 'tests/test_cks_dynamic_views_stage4.py'
      - 'tests/test_cks_knowledge_intelligence_stage5.py'
      - 'tests/test_cks_knowledge_evolution_stage6.py'
      - 'tests/test_cks_full_self_audit_stage7.py'
      - 'tests/test_cks_graph_evolution_stage_b.py'
      - 'tests/test_cks_graph_node_lifecycle_stage_d.py'
      - 'tests/test_cks_post_snapshot_integrity_stage_e2.py'
      - '.github/workflows/cks-knowledge-runtime-intelligence.yml'
  pull_request:
    paths:
      - 'tools/cks_knowledge_runtime.py'
      - 'tools/cks_knowledge_state_machine.py'
      - 'tools/cks_obsidian_export.py'
      - 'tools/cks_dynamic_views.py'
      - 'tools/cks_knowledge_intelligence.py'
      - 'tools/cks_knowledge_evolution.py'
      - 'tools/cks_version_change_analyzer.py'
      - 'tools/cks_knowledge_graph_runtime.py'
      - 'tools/cks_graph_node_versioning.py'
      - 'tools/cks_traceability_engine.py'
      - 'tools/cks_knowledge_federation.py'
      - 'tools/cks_governance_runner.py'
      - 'tools/cks_runtime_pipeline.py'
      - 'tools/cks_self_audit.py'
      - 'tools/cks_compatibility_audit.py'
      - 'tools/cks_v1_4_*.py'
      - 'tools/cks_v1_6_intelligence_runtime.py'
      - 'tools/cks_canon_conflict_detector.py'
      - 'tools/cks_knowledge_health_score.py'
