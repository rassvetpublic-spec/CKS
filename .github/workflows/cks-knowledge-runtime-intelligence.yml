name: CKS — рабочий контур и аналитика знаний

on:
  push:
    paths:
      - 'tools/cks_knowledge_runtime.py'
      - 'tools/cks_knowledge_state_machine.py'
      - 'tools/cks_obsidian_export.py'
      - 'tools/cks_dynamic_views.py'
      - 'tools/cks_knowledge_intelligence.py'
      - 'tools/cks_self_audit.py'
      - 'validators/lifecycle_guard.py'
      - 'schemas/cks-knowledge-object.schema.json'
      - 'schemas/cks-knowledge-view.schema.json'
      - 'obsidian/**'
      - 'docs/CKS_KNOWLEDGE_RUNTIME_AND_INTELLIGENCE_RU.md'
      - 'docs/ГЛОССАРИЙ.md'
      - 'decisions/ADR-0002-knowledge-centric-runtime.md'
      - 'tests/test_knowledge_runtime_intelligence.py'
      - 'tests/test_cks_knowledge_runtime_stage2.py'
      - 'tests/test_cks_obsidian_stage3.py'
      - 'tests/test_cks_dynamic_views_stage4.py'
      - 'tests/test_cks_knowledge_intelligence_stage5.py'
      - '.github/workflows/cks-knowledge-runtime-intelligence.yml'
  pull_request:
    paths:
      - 'tools/cks_knowledge_runtime.py'
      - 'tools/cks_knowledge_state_machine.py'
      - 'tools/cks_obsidian_export.py'
      - 'tools/cks_dynamic_views.py'
      - 'tools/cks_knowledge_intelligence.py'
      - 'tools/cks_self_audit.py'
      - 'validators/lifecycle_guard.py'
      - 'schemas/cks-knowledge-object.schema.json'
      - 'schemas/cks-knowledge-view.schema.json'
      - 'obsidian/**'
      - 'docs/CKS_KNOWLEDGE_RUNTIME_AND_INTELLIGENCE_RU.md'
      - 'docs/ГЛОССАРИЙ.md'
      - 'decisions/ADR-0002-knowledge-centric-runtime.md'
      - 'tests/test_knowledge_runtime_intelligence.py'
      - 'tests/test_cks_knowledge_runtime_stage2.py'
      - 'tests/test_cks_obsidian_stage3.py'
      - 'tests/test_cks_dynamic_views_stage4.py'
      - 'tests/test_cks_knowledge_intelligence_stage5.py'
      - '.github/workflows/cks-knowledge-runtime-intelligence.yml'

permissions:
  contents: read

jobs:
  knowledge-runtime:
    name: Проверка этапов 2–5 рабочего контура знаний
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверить синтаксис модулей этапов 2–5
        run: |
          python -m py_compile tools/cks_knowledge_runtime.py
          python -m py_compile tools/cks_knowledge_state_machine.py
          python -m py_compile tools/cks_obsidian_export.py
          python -m py_compile tools/cks_dynamic_views.py
          python -m py_compile tools/cks_knowledge_intelligence.py
          python -m py_compile tools/cks_self_audit.py
          python -m py_compile validators/lifecycle_guard.py

      - name: Этап 2 — рабочий контур и состояния
        run: python -m unittest discover -s tests -p 'test_cks_knowledge_runtime_stage2.py' -v

      - name: Этап 3 — Obsidian и графическое представление
        run: python -m unittest discover -s tests -p 'test_cks_obsidian_stage3.py' -v

      - name: Этап 4 — динамические представления
        run: python -m unittest discover -s tests -p 'test_cks_dynamic_views_stage4.py' -v

      - name: Базовая регрессия runtime и intelligence
        run: python -m unittest discover -s tests -p 'test_knowledge_runtime_intelligence.py' -v

      - name: Этап 5 — структурная аналитика знаний
        run: python -m unittest discover -s tests -p 'test_cks_knowledge_intelligence_stage5.py' -v

      - name: Выполнить самопроверку CKS
        run: python tools/cks_self_audit.py --root . --report reports/knowledge-runtime-self-audit.json

      - name: Опубликовать диагностический отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cks-knowledge-runtime-self-audit
          path: reports/knowledge-runtime-self-audit.json
          if-no-files-found: warn
