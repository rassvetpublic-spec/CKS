name: CKS Preflight

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CKS structure
        run: |
          test -d protocols
          test -d schemas
          test -d decisions
          test -d evidence
          test -d graveyard
