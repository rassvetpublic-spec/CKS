name: CKS Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate CKS structure and contracts
        run: python tools/cks_ci.py --mode all
      - name: Upload CKS validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cks-validation-report
          path: artifacts/cks-ci/
