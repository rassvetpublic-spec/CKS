name: CKS Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Guard GitHub Actions Node.js 24 migration
        run: python -m unittest discover -s tests -p 'test_cks_github_actions_node24_stage_e3_3.py' -v
      - name: Run E3.4 final post-snapshot regression
        run: python -m unittest discover -s tests -p 'test_cks_post_snapshot_final_regression_stage_e3_4.py' -v
      - name: Validate CKS structure and contracts
        run: python tools/cks_ci.py --mode all
      - name: Upload CKS validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cks-validation-report
          path: artifacts/cks-ci/
