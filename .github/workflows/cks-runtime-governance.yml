name: CKS — проверка рабочего ядра и архитектуры

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-governance:
    name: Рабочий граф, трассируемость, федерация и самоаудит
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверить синтаксис рабочего контура
        run: |
          python -m py_compile \
            tools/cks_knowledge_graph_runtime.py \
            tools/cks_traceability_engine.py \
            tools/cks_knowledge_federation.py \
            tools/cks_self_audit.py \
            tools/cks_runtime_pipeline.py \
            tools/cks_governance_runner.py

      - name: Запустить интеграционные тесты
        run: python tests/test_cks_runtime_core.py -v

      - name: Выполнить самоаудит CKS
        run: python tools/cks_self_audit.py --root . --report artifacts/cks-runtime/self-audit.json

      - name: Выполнить управляющие проверки CKS
        run: python tools/cks_governance_runner.py --root . --report artifacts/cks-runtime/governance.json

      - name: Сохранить диагностические артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cks-runtime-governance
          path: artifacts/cks-runtime/
          if-no-files-found: warn
