name: CKS Council Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-council:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependency
        run: python -m pip install -r council/requirements-check.txt
      - name: Validate Council contracts
        run: python scripts/validate_council.py
      - name: Test incompatible configuration rejection
        run: python -m unittest discover -s tests/council -v
      - name: Check pilot context budget
        run: python scripts/check_council_packet.py council/pilot/handoff.json
