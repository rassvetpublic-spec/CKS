name: CKS Review Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run CKS Review Gate
        uses: ./.github/actions/cks-review-gate
      - name: Upload Review Gate result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cks-review-gate-result
          path: artifacts/cks-ci/
