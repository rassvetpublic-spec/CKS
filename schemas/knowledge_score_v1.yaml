version: 1
object: knowledge_score
fields:
  value_level:
    type: string
    enum:
      - P0
      - P1
      - P2
      - P3
  confidence:
    type: number
  evidence_count:
    type: integer
  usage_score:
    type: number
  freshness_score:
    type: number
  validation_state:
    type: string
    enum:
      - draft
      - validated
      - canon_ready
rules:
  canon_requires_evidence: true
  canon_requires_decision: true
