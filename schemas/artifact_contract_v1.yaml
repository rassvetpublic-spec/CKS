version: 1
name: artifact_contract

artifact:
  id: string
  type: knowledge|decision|evidence|document|idea|rule|graveyard
  domain: string
  status: candidate|draft|active|accepted|canon|archived|graveyard
  source: string
  created_at: datetime
  updated_at: datetime
  evidence:
    required_for_decision: true
    references: []
  decision_reference: string|null
  lifecycle:
    owner: string
    review_required: false

rules:
  canon_requires_evidence: true
  canon_requires_decision_reference: true
  raw_context_as_artifact: false
