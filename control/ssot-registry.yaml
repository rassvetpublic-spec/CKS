ssot:
  architecture:
    status: unresolved
    issue: 29
    candidates:
      - ARCHITECTURE.md
      - docs/ARCHITECTURE.md
      - docs/architecture/
    note: "Архитектурный SSoT не назначается автоматически по результатам аудита. Кандидаты перечислены для Decision по Issue #29."
  schemas:
    path: schemas/
  decisions:
    path: decisions/
  protocols:
    path: protocols/
  knowledge:
    path: knowledge/
  evidence:
    path: evidence/
  runtime:
    path: tools/
    note: "Фактические исполняемые модули CKS находятся в tools/. Производные runtime-результаты не становятся SSOT."
  runtime_rules:
    path: engine/
    note: "engine/ содержит правила продвижения и другие правила рабочего контура, но не основной исполняемый код."
  obsidian_views:
    path: obsidian/
    authority: derived_view_only
    note: "Obsidian — производное графическое представление, не SSOT."

record:
  required_fields:
    - id
    - type
    - status
    - version
    - source
